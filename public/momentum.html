<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Küresel Likidite İndeksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--panel:#F4F6F8;--line:#E5E7EB;--ink:#111827;--dim:#6B7280;--faint:#9CA3AF;--rise:#059669;--fall:#DC2626;--btc:#D97706}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden;width:100%}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;padding:0 0 56px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
.mast{display:flex;justify-content:space-between;align-items:baseline;padding:24px 0 16px;border-bottom:1px solid var(--line)}
.mast .name{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mast .date{font-family:"DM Mono",monospace;font-size:11px;color:var(--faint)}
.hero{padding:24px 0 20px;text-align:center}
.kicker{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.gauge-box{position:relative;width:100%;max-width:280px;height:150px;margin:0 auto 10px}
.gauge-val{font-family:"Instrument Serif",serif;font-size:42px;line-height:1;margin-top:-10px}
.sub{font-size:14px;color:var(--ink);margin-top:12px;line-height:1.5;font-weight:300}
.sub .state{display:block;margin-top:6px;font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 10px;font-family:"DM Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.03em}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px;border-radius:2px}
canvas{width:100%!important;height:auto!important;display:block}
.ranges{display:flex;margin-top:14px;background:var(--panel);border-radius:9px;padding:3px}
.ranges button{flex:1;appearance:none;background:transparent;border:0;padding:10px 4px;cursor:pointer;border-radius:7px;font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.05em}
.ranges button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
